syntax = "proto3";
import "ai/looqs/android/data/dark_theme_config.proto";


option java_package = "ai.looqs.android.core.datastore";
option java_multiple_files = true;

message UserPreferences {
  DarkThemeConfigProto dark_theme_config = 1;
  bool is_projection_approved = 2;
  string assistant_id = 3;
  string thread_id = 4;
}